<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 34" role="img" aria-label="vyom.ai">
  <defs>
    <linearGradient id="vyomFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a7a"/>
      <stop offset=".55" stop-color="#eb5d62"/>
      <stop offset="1" stop-color="#7a1115"/>
    </linearGradient>
    <filter id="vyomGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.2  0 0 0 0 0.25  0 0 0 0.55 0"/>
    </filter>
  </defs>
  <g filter="url(#vyomGlow)">
    <text x="2" y="25" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="26" letter-spacing="0.5" fill="#eb5d62">VYOM</text>
  </g>
  <text x="2" y="25" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="26" letter-spacing="0.5" fill="url(#vyomFill)">VYOM</text>
  <text x="100" y="25" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" letter-spacing="0.5" fill="#b4a3a3">AI</text>
</svg>
